<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damir Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
overflow-x:hidden;
}

/* ===== BACKGROUND ===== */
.blob{
position:absolute;
width:300px;
height:300px;
background:rgba(0,255,200,0.12);
border-radius:50%;
filter:blur(70px);
animation:move 10s infinite alternate;
z-index:-1;
}

.blob:nth-child(2){
top:60%;
left:70%;
background:rgba(0,150,255,0.12);
}

.blob:nth-child(3){
top:20%;
left:10%;
background:rgba(255,0,200,0.08);
}

@keyframes move{
0%{transform:translate(0,0);}
100%{transform:translate(120px,80px);}
}

/* ===== HEADER ===== */
header{
text-align:center;
padding:60px 20px 30px;
}

.avatar{
width:130px;
height:130px;
border-radius:50%;
border:3px solid #00ffd5;
box-shadow:0 0 25px #00ffd5;
margin-bottom:15px;
object-fit:cover;
}

h1{
font-size:38px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.7;
margin-top:10px;
}

/* ===== SKILLS ===== */
.skills{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:25px;
}

.skill{
padding:10px 15px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.skill:hover{
transform:scale(1.1);
background:rgba(0,255,200,0.2);
}

/* ===== CARDS ===== */
.container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:50px;
padding:20px;
}

.card{
width:280px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 10px 30px rgba(0,255,200,0.2);
}

.card h3{
color:#00ffd5;
margin-bottom:10px;
}

.card p{
font-size:14px;
opacity:0.7;
}

button{
margin-top:10px;
padding:8px 15px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:30px;
opacity:0.5;
margin-top:50px;
}
</style>
</head>

<body>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<header>

<!-- 👇 НОВАЯ АВАТАРКА ПРОГРАММИСТА -->
<img class="avatar" src="https://cdn-icons-png.flaticon.com/512/1006/1006363.png">

<h1>Damir</h1>
<p>Web Developer • Student • Future IT Engineer</p>

<div class="skills">
<div class="skill">HTML</div>
<div class="skill">CSS</div>
<div class="skill">JavaScript</div>
<div class="skill">UI Design</div>
<div class="skill">Python</div>
</div>

</header>

<div class="container">

<div class="card">
<h3>🌐 Веб-сайт</h3>
<p>Менің алғашқы заманауи сайт жобам.</p>
<button onclick="openProject()">Ашу</button>
</div>

<div class="card">
<h3>🎨 Дизайн</h3>
<p>Креативті UI/UX интерфейс макеттері.</p>
<button onclick="openProject()">Ашу</button>
</div>

<div class="card">
<h3>⚙️ Код</h3>
<p>Интерактивті JavaScript элементтері.</p>
<button onclick="openProject()">Ашу</button>
</div>

</div>

<footer>
© 2026 Damir Portfolio | Built with passion 💙
</footer>

<script>
function openProject(){
alert("Жоба ашылды 🚀");
}
</script>

</body>
</html>
