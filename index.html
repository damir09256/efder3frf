<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ақылды тест жүйесі</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:420px;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
animation:fade 1s ease;
}

h1{
margin-bottom:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.7;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
text-align:center;
font-size:16px;
outline:none;
margin-top:10px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

#result{
margin-top:15px;
font-weight:bold;
}

#level{
margin-top:10px;
opacity:0.8;
}

@keyframes fade{
from{opacity:0;transform:translateY(-20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">

<h1>🧠 Ақылды тест</h1>
<p id="question">Жүктелуде...</p>

<input id="answer" placeholder="Жауабыңды жаз...">

<button onclick="check()">Тексеру</button>

<div id="result"></div>
<div id="level"></div>

</div>

<script>

// 📌 10 сұрақ (жеңіл + қиын деңгей)
let questions = [
{q:"2 + 2 =", a:"4", level:1},
{q:"5 + 3 =", a:"8", level:1},
{q:"10 - 4 =", a:"6", level:1},
{q:"3 × 3 =", a:"9", level:1},
{q:"12 / 3 =", a:"4", level:1},

{q:"15 + 7 =", a:"22", level:2},
{q:"18 - 9 =", a:"9", level:2},
{q:"6 × 4 =", a:"24", level:2},
{q:"36 / 6 =", a:"6", level:2},
{q:"20 + 15 =", a:"35", level:2},
];

let current = 0;
let score = 0;

// сұрақты көрсету
function load(){
document.getElementById("question").innerText = questions[current].q;
document.getElementById("answer").value = "";
document.getElementById("level").innerText = "Level: " + questions[current].level;
}

load();

// тексеру
function check(){
let user = document.getElementById("answer").value;
let res = document.getElementById("result");

if(user == questions[current].a){
score++;
res.style.color = "#00ff99";
res.innerHTML = "✔ Дұрыс!";

}else{
res.style.color = "#ff4d4d";
res.innerHTML = "✖ Қате!";
}

current++;

// егер тест бітсе
if(current >= questions.length){
document.getElementById("question").innerHTML =
"🎉 Тест аяқталды! Нәтиже: " + score + "/10";

document.getElementById("level").innerHTML = "";

return;
}

setTimeout(load, 800);
}

</script>

</body>
</html>
