<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ақылды Емтихан Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:450px;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

h1{
margin-bottom:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.8;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
text-align:center;
font-size:16px;
outline:none;
margin-top:10px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

#result{
margin-top:15px;
font-weight:bold;
}

#info{
margin-top:10px;
opacity:0.7;
font-size:14px;
}

.progress{
width:100%;
height:8px;
background:rgba(255,255,255,0.1);
border-radius:10px;
margin-top:15px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ffd5,#00aaff);
transition:0.4s;
}
</style>
</head>

<body>

<div class="card">

<h1>🧠 Емтихан Pro</h1>

<p id="question">Жүктелуде...</p>

<input id="answer" placeholder="Жауап жаз...">

<button onclick="check()">Тексеру</button>

<div id="result"></div>
<div id="info"></div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

</div>

<script>

// 📊 КҮШТІ СҰРАҚТАР (мектеп деңгейі)
let questions = [
{q:"12 + 18 =", a:"30", level:"Easy"},
{q:"45 - 19 =", a:"26", level:"Easy"},
{q:"6 × 7 =", a:"42", level:"Easy"},

{q:"(15 + 5) / 4 =", a:"5", level:"Medium"},
{q:"3² + 4² =", a:"25", level:"Medium"},
{q:"2x = 14, x =", a:"7", level:"Medium"},

{q:"(36 ÷ 6) × 3 =", a:"18", level:"Hard"},
{q:"√81 =", a:"9", level:"Hard"},
{q:"5² - 3² =", a:"16", level:"Hard"},
{q:"(10 + 5) × 2 - 10 =", a:"20", level:"Hard"},
];

let current = 0;
let score = 0;

function load(){
document.getElementById("question").innerText = questions[current].q;
document.getElementById("answer").value = "";
document.getElementById("info").innerText = "Level: " + questions[current].level;
updateBar();
}

function updateBar(){
let percent = (current / questions.length) * 100;
document.getElementById("bar").style.width = percent + "%";
}

load();

function check(){
let user = document.getElementById("answer").value;
let res = document.getElementById("result");

if(user == questions[current].a){
score++;
res.style.color = "#00ff99";
res.innerHTML = "✔ Дұрыс!";
}else{
res.style.color = "#ff4d4d";
res.innerHTML = "✖ Қате!";
}

current++;

if(current >= questions.length){
document.getElementById("question").innerHTML =
"🎉 Емтихан аяқталды! Нәтиже: " + score + " / " + questions.length;

document.getElementById("info").innerHTML = "";

updateBar();

return;
}

updateBar();
setTimeout(load, 700);
}

</script>

</body>
</html>
