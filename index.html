<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Автоматты тексеру жүйесі</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

/* ФОН */
.bg{
position:absolute;
width:100%;
height:100%;
z-index:-1;
}

.circle{
position:absolute;
width:250px;
height:250px;
background:rgba(0,255,200,0.12);
border-radius:50%;
filter:blur(70px);
animation:move 8s infinite alternate;
}

.circle:nth-child(2){
top:60%;
left:70%;
background:rgba(0,150,255,0.12);
}

@keyframes move{
0%{transform:translate(0,0);}
100%{transform:translate(100px,80px);}
}

/* КАРТОЧКА */
.card{
width:400px;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 10px 40px rgba(0,0,0,0.5);
text-align:center;
animation:fade 1.5s ease;
}

h1{
margin-bottom:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.7;
margin-bottom:20px;
}

/* INPUT */
input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
outline:none;
margin-top:10px;
text-align:center;
font-size:16px;
}

/* BUTTON */
button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffd5,#00aaff);
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* RESULT */
#result{
margin-top:15px;
font-weight:bold;
}

/* ANIMATION */
@keyframes fade{
from{opacity:0;transform:translateY(-20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
</div>

<div class="card">

<h1>🧠 Тексеру жүйесі</h1>
<p>Мысал: 2 + 2 = ?</p>

<input id="answer" type="text" placeholder="Жауабыңды жаз...">

<button onclick="check()">Тексеру</button>

<div id="result"></div>

</div>

<script>
function check(){
let ans = document.getElementById("answer").value;
let result = document.getElementById("result");

if(ans == "4"){
result.style.color = "#00ff99";
result.innerHTML = "✔ Дұрыс жауап!";
}else{
result.style.color = "#ff4d4d";
result.innerHTML = "✖ Қате, қайта көр!";
}
}
</script>

</body>
</html>
